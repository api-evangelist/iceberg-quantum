name: Iceberg Quantum
description: >-
  Iceberg Quantum is a quantum architecture firm building fault-tolerant quantum
  computing systems around LDPC (Low-Density Parity-Check) error-correction codes.
  Its designs aim to cut the hardware overhead of quantum error correction by more
  than an order of magnitude, and its Pinnacle architecture claims roughly 10x lower
  overhead through modular lattice surgery and time-overhead compression. The company
  is hardware- and architecture-focused rather than a software/API provider; it
  partners with qubit hardware makers (PsiQuantum, Diraq, Oxford Ionics) and is backed
  by DCVC, Blackbird, and LocalGlobe. Surfaced as a DCVC portfolio company and added
  to the API Evangelist network for tracking; there is no public API, SDK, or developer
  surface to enrich at this stage.
